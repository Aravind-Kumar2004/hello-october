<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hello October</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #2d1600,
                #8f3f00,
                #d66a00
            );

            color: white;
        }

        .container {
            width: 90%;
            max-width: 700px;
            padding: 60px 30px;
            text-align: center;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);

            border-radius: 25px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .leaf {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 28px;
            font-weight: normal;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            opacity: 0.9;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;

            background: white;
            color: #8f3f00;

            text-decoration: none;
            font-weight: bold;

            border-radius: 30px;

            transition: 0.3s;
        }

        .button:hover {
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 42px;
            }

            h2 {
                font-size: 22px;
            }

            p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="leaf">
            🍂🍁🍂
        </div>

        <h1>Hello October</h1>

        <h2>A new month. A fresh beginning.</h2>

        <p>
            Welcome October 2026.
            Make this month meaningful, productive and memorable.
        </p>

        <a href="#" class="button">
            Start Something New
        </a>

    </div>

</body>
</html>
